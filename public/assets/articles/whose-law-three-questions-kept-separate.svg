   <g id="text_1">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1a3a5c" x="320.4" y="35.813125" transform="rotate(-0 320.4 35.813125)">Three Questions, Kept Separate</text>
   </g>
   <g id="text_2">
    <text style="font-style: italic; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5a6470" x="320.4" y="62.415156" transform="rotate(-0 320.4 62.415156)">Conflating these is among the most common sources of avoidable cost</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="132.48" y="109.235313" transform="rotate(-0 132.48 109.235313)">FORUM</text>
   </g>
   <g id="text_4">
    <text style="font-style: italic; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="132.48" y="122.157969" transform="rotate(-0 132.48 122.157969)">Where</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(73.301 161.669825)">Which court or arbitral</text>
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(97.182187 173.369925)">seat decides?</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2b2b2b" x="82.368" y="244.75325" transform="rotate(-0 82.368 244.75325)">Reduces forum shopping</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(82.368 279.710631)">Limits jurisdictional</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(82.368 290.233369)">challenges</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(82.368 319.929381)">Curbs parallel</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(82.368 330.452119)">proceedings</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="320.4" y="109.235313" transform="rotate(-0 320.4 109.235313)">GOVERNING LAW</text>
   </g>
   <g id="text_10">
    <text style="font-style: italic; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="320.4" y="122.157969" transform="rotate(-0 320.4 122.157969)">Under what rules</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(270.013469 155.711963)">Which legal system</text>
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(268.044812 167.483938)">governs the parties'</text>
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(270.266469 179.255913)">substantive rights?</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(270.288 239.491881)">Does not follow</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(270.288 250.014619)">from forum choice</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(270.288 279.710631)">Drives interpretation</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(270.288 290.233369)">of obligations</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(270.288 319.929381)">Frequent drafting</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(270.288 330.452119)">error to conflate</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="508.32" y="109.235313" transform="rotate(-0 508.32 109.235313)">ENFORCEMENT</text>
   </g>
   <g id="text_16">
    <text style="font-style: italic; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="508.32" y="122.157969" transform="rotate(-0 508.32 122.157969)">Where recovery happens</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(451.189437 155.7479)">Where are the assets,</text>
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(441.319562 167.448)">and how does a judgment</text>
    <text style="font-weight: 700; font-size: 9.2px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(461.175031 179.219975)">become recovery?</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(458.208 239.491881)">Most often deferred</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(458.208 250.014619)">at drafting</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(458.208 279.710631)">Determines if action</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(458.208 290.233369)">is worth pursuing</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(458.208 319.929381)">Shapes defence-cost</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #2b2b2b" transform="translate(458.208 330.452119)">exposure</text>
   </g>
