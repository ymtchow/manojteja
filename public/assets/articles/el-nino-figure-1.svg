<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Normal year and El Nino rainfall movement</title>
  <desc id="desc">Diagram comparing normal trade wind conditions with El Nino conditions across the tropical Pacific.</desc>
  <rect width="1080" height="620" fill="#f7f2ea"/>
  <rect x="48" y="42" width="984" height="536" rx="28" fill="#ffffff" stroke="#d8c6a3"/>
  <text x="90" y="100" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#102031">How El Niño shifts the rain machine</text>
  <text x="90" y="134" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6a75">Warm water and rainfall move east when Pacific trade winds weaken.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="90" y="178" width="410" height="318" rx="22" fill="#eef5f4" stroke="#b9d3cf"/>
    <text x="295" y="224" text-anchor="middle" font-size="25" font-weight="800" fill="#102031">Normal year</text>
    <rect x="142" y="352" width="306" height="56" rx="28" fill="#2a6f85" opacity="0.9"/>
    <path d="M410 292C340 262 265 258 188 286" stroke="#d8b36a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M415 294l-34-21 4 36z" fill="#d8b36a"/>
    <text x="295" y="454" text-anchor="middle" font-size="17" fill="#405061">Trade winds push warm water toward Asia and Australia.</text>
    <circle cx="198" cy="285" r="34" fill="#d8b36a" opacity="0.9"/>
    <path d="M242 276c26-38 80-40 112-4" stroke="#6c9fb0" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text x="194" y="342" font-size="15" fill="#102031">Rain closer to Asia</text>
    <rect x="580" y="178" width="410" height="318" rx="22" fill="#fff1df" stroke="#d8c6a3"/>
    <text x="785" y="224" text-anchor="middle" font-size="25" font-weight="800" fill="#102031">El Niño year</text>
    <rect x="632" y="352" width="306" height="56" rx="28" fill="#be7b3b" opacity="0.9"/>
    <path d="M660 292C728 252 808 254 900 286" stroke="#d8b36a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M904 288l-37-13 12 34z" fill="#d8b36a"/>
    <text x="785" y="454" text-anchor="middle" font-size="17" fill="#405061">Warm water and rainfall slide east across the Pacific.</text>
    <circle cx="886" cy="285" r="34" fill="#d8b36a" opacity="0.9"/>
    <path d="M782 276c26-38 80-40 112-4" stroke="#6c9fb0" stroke-width="7" fill="none" stroke-linecap="round"/>
    <text x="746" y="342" font-size="15" fill="#102031">Rain shifts east</text>
  </g>
</svg>
