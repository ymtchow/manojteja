<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">How insurance jobs are changing</title>
  <desc id="desc">Three grouped columns showing insurance roles under pressure, roles being transformed, and newly created roles.</desc>
  <rect width="1080" height="620" fill="#f7f2ea"/>
  <rect x="54" y="42" width="972" height="526" rx="26" fill="#ffffff" stroke="#d8c6a3"/>
  <text x="90" y="102" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#102031">How insurance jobs are changing</text>
  <text x="90" y="136" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6a75">Three groups, each moving in a different direction</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="90" y="184" width="285" height="318" rx="18" fill="#f4dedf" stroke="#d7aaaa"/>
    <text x="232" y="229" text-anchor="middle" font-size="22" font-weight="800" fill="#9b4f58">Under pressure</text>
    <text x="232" y="258" text-anchor="middle" font-size="15" fill="#8d5e63">Routine, repeating work</text>
    <text x="120" y="304" font-size="17" fill="#3e4650">Claims processing clerks</text>
    <text x="120" y="342" font-size="17" fill="#3e4650">Data entry staff</text>
    <text x="120" y="380" font-size="17" fill="#3e4650">Policy processors</text>
    <text x="120" y="418" font-size="17" fill="#3e4650">Junior underwriting assistants</text>
    <text x="120" y="456" font-size="17" fill="#3e4650">Desk claims adjusters</text>
    <text x="120" y="494" font-size="17" fill="#3e4650">Routine call-centre agents</text>
    <rect x="398" y="184" width="285" height="318" rx="18" fill="#f3e6d0" stroke="#d4bd91"/>
    <text x="540" y="229" text-anchor="middle" font-size="22" font-weight="800" fill="#9a6b25">Being transformed</text>
    <text x="540" y="258" text-anchor="middle" font-size="15" fill="#8e7348">Less data, more judgement</text>
    <text x="428" y="304" font-size="17" fill="#3e4650">Senior underwriters</text>
    <text x="428" y="331" font-size="14" fill="#69717b">(complex risks)</text>
    <text x="428" y="374" font-size="17" fill="#3e4650">Claims handlers and</text>
    <text x="428" y="397" font-size="17" fill="#3e4650">field adjusters</text>
    <text x="428" y="440" font-size="17" fill="#3e4650">Actuaries</text>
    <text x="428" y="463" font-size="14" fill="#69717b">(model validators)</text>
    <text x="428" y="501" font-size="17" fill="#3e4650">Compliance and regulatory staff</text>
    <rect x="706" y="184" width="285" height="318" rx="18" fill="#dfeee8" stroke="#9fcec0"/>
    <text x="848" y="229" text-anchor="middle" font-size="22" font-weight="800" fill="#2f7868">Newly created</text>
    <text x="848" y="258" text-anchor="middle" font-size="15" fill="#4d806f">Did not exist 5 years ago</text>
    <text x="736" y="304" font-size="17" fill="#3e4650">AI governance engineers</text>
    <text x="736" y="342" font-size="17" fill="#3e4650">Model validation specialists</text>
    <text x="736" y="380" font-size="17" fill="#3e4650">AI underwriting data managers</text>
    <text x="736" y="418" font-size="17" fill="#3e4650">Insurance prompt engineers</text>
    <text x="736" y="456" font-size="17" fill="#3e4650">Data scientists</text>
  </g>
  <text x="540" y="548" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6f6a60">Figure 2. How insurance jobs are changing.</text>
</svg>
