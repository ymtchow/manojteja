<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">India 2026 monsoon outlook</title>
  <desc id="desc">Chart showing April forecast at 92 percent and May forecast at 90 percent of long-period average rainfall, below the normal band of 96 to 104 percent.</desc>
  <rect width="1080" height="620" fill="#f7f2ea"/>
  <rect x="54" y="42" width="972" height="526" rx="26" fill="#ffffff" stroke="#d8c6a3"/>
  <text x="90" y="100" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#102031">India monsoon outlook, 2026</text>
  <text x="90" y="134" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6a75">Seasonal rainfall forecast as percentage of Long Period Average</text>
  <g font-family="Inter, Arial, sans-serif">
    <line x1="170" y1="454" x2="930" y2="454" stroke="#9a8d77" stroke-width="2"/>
    <line x1="170" y1="190" x2="170" y2="454" stroke="#9a8d77" stroke-width="2"/>
    <rect x="171" y="260" width="758" height="58" fill="#e8f0e8" opacity="0.95"/>
    <text x="910" y="252" text-anchor="end" font-size="15" fill="#4f7657" font-weight="700">Normal band: 96% to 104%</text>
    <g font-size="14" fill="#5d6670">
      <text x="142" y="459" text-anchor="end">80</text>
      <text x="142" y="393" text-anchor="end">88</text>
      <text x="142" y="327" text-anchor="end">96</text>
      <text x="142" y="261" text-anchor="end">104</text>
      <text x="142" y="195" text-anchor="end">112</text>
    </g>
    <g stroke="#eadfcf" stroke-width="1">
      <line x1="170" y1="388" x2="930" y2="388"/>
      <line x1="170" y1="322" x2="930" y2="322"/>
      <line x1="170" y1="256" x2="930" y2="256"/>
      <line x1="170" y1="190" x2="930" y2="190"/>
    </g>
    <rect x="328" y="355" width="120" height="99" rx="8" fill="#d8b36a"/>
    <rect x="640" y="371" width="120" height="83" rx="8" fill="#be7b3b"/>
    <text x="388" y="342" text-anchor="middle" font-size="24" font-weight="800" fill="#102031">92%</text>
    <text x="700" y="358" text-anchor="middle" font-size="24" font-weight="800" fill="#102031">90%</text>
    <text x="388" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#102031">April forecast</text>
    <text x="700" y="492" text-anchor="middle" font-size="18" font-weight="700" fill="#102031">May update</text>
    <rect x="778" y="371" width="118" height="48" rx="24" fill="#102031"/>
    <text x="837" y="402" text-anchor="middle" font-size="15" font-weight="800" fill="#d8b36a">Below normal</text>
  </g>
</svg>
