<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Four insurance exposure themes from El Nino</title>
  <desc id="desc">Four insurance exposure themes: crop insurance, flood insurance, protection gap, and reinsurance correlation.</desc>
  <rect width="1080" height="620" fill="#f7f2ea"/>
  <rect x="54" y="42" width="972" height="526" rx="26" fill="#ffffff" stroke="#d8c6a3"/>
  <text x="90" y="100" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#102031">How El Niño reaches the insurance balance sheet</text>
  <text x="90" y="134" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5f6a75">The meteorology becomes an underwriting and capital question.</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="96" y="190" width="205" height="250" rx="20" fill="#fff1df" stroke="#d8c6a3"/>
    <circle cx="199" cy="250" r="36" fill="#d8b36a"/>
    <text x="199" y="260" text-anchor="middle" font-size="27" font-weight="800" fill="#102031">1</text>
    <text x="199" y="326" text-anchor="middle" font-size="22" font-weight="800" fill="#102031">Crop insurance</text>
    <text x="199" y="360" text-anchor="middle" font-size="15" fill="#5f6a75">income stability</text>
    <text x="199" y="386" text-anchor="middle" font-size="15" fill="#5f6a75">after weak rainfall</text>
    <rect x="328" y="190" width="205" height="250" rx="20" fill="#eaf4f6" stroke="#b7d0d8"/>
    <circle cx="431" cy="250" r="36" fill="#6c9fb0"/>
    <text x="431" y="260" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">2</text>
    <text x="431" y="326" text-anchor="middle" font-size="22" font-weight="800" fill="#102031">Flood insurance</text>
    <text x="431" y="360" text-anchor="middle" font-size="15" fill="#5f6a75">property, infrastructure</text>
    <text x="431" y="386" text-anchor="middle" font-size="15" fill="#5f6a75">and continuity</text>
    <rect x="560" y="190" width="205" height="250" rx="20" fill="#f4dedf" stroke="#d7aaaa"/>
    <circle cx="663" cy="250" r="36" fill="#9b4f58"/>
    <text x="663" y="260" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">3</text>
    <text x="663" y="326" text-anchor="middle" font-size="22" font-weight="800" fill="#102031">Protection gap</text>
    <text x="663" y="360" text-anchor="middle" font-size="15" fill="#5f6a75">uninsured losses move</text>
    <text x="663" y="386" text-anchor="middle" font-size="15" fill="#5f6a75">to public balance sheets</text>
    <rect x="792" y="190" width="205" height="250" rx="20" fill="#eef0f5" stroke="#c1c8d4"/>
    <circle cx="895" cy="250" r="36" fill="#102031"/>
    <text x="895" y="260" text-anchor="middle" font-size="27" font-weight="800" fill="#d8b36a">4</text>
    <text x="895" y="326" text-anchor="middle" font-size="22" font-weight="800" fill="#102031">Reinsurance</text>
    <text x="895" y="360" text-anchor="middle" font-size="15" fill="#5f6a75">correlated regional</text>
    <text x="895" y="386" text-anchor="middle" font-size="15" fill="#5f6a75">accumulation</text>
    <path d="M178 485H902" stroke="#d8b36a" stroke-width="4" stroke-linecap="round"/>
    <path d="M902 485l-30-16v32z" fill="#d8b36a"/>
    <text x="540" y="524" text-anchor="middle" font-size="18" font-weight="700" fill="#102031">Weather signal → insurance trigger → capital response</text>
  </g>
</svg>
