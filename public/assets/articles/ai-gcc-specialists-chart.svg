<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">AI specialists by country in 2025</title>
  <desc id="desc">Bar chart comparing estimated AI specialists in the UAE, Saudi Arabia, and Germany.</desc>
  <rect width="960" height="560" fill="#f7f2ea"/>
  <rect x="54" y="42" width="852" height="464" rx="24" fill="#ffffff" stroke="#d8c6a3"/>
  <text x="480" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#102031">A direct read on the GCC talent pipeline</text>
  <text x="480" y="124" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#405061">AI specialists by country (2025)</text>
  <line x1="140" y1="420" x2="820" y2="420" stroke="#9a8d77" stroke-width="2"/>
  <line x1="140" y1="160" x2="140" y2="420" stroke="#9a8d77" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#5d6670">
    <text x="108" y="424" text-anchor="end">0</text>
    <text x="108" y="359" text-anchor="end">10,000</text>
    <text x="108" y="294" text-anchor="end">20,000</text>
    <text x="108" y="229" text-anchor="end">30,000</text>
    <text x="108" y="164" text-anchor="end">40,000+</text>
  </g>
  <g stroke="#eadfcf" stroke-width="1">
    <line x1="140" y1="355" x2="820" y2="355"/>
    <line x1="140" y1="290" x2="820" y2="290"/>
    <line x1="140" y1="225" x2="820" y2="225"/>
    <line x1="140" y1="160" x2="820" y2="160"/>
  </g>
  <rect x="205" y="374" width="110" height="46" rx="6" fill="#1f78b4"/>
  <rect x="425" y="388" width="110" height="32" rx="6" fill="#1f78b4"/>
  <rect x="645" y="160" width="110" height="260" rx="6" fill="#1f78b4"/>
  <g font-family="Inter, Arial, sans-serif" fill="#102031">
    <text x="260" y="360" text-anchor="middle" font-size="16" font-weight="700">7,000+</text>
    <text x="480" y="374" text-anchor="middle" font-size="16" font-weight="700">5,000+</text>
    <text x="700" y="146" text-anchor="middle" font-size="16" font-weight="700">40,000+</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16" fill="#405061">
    <text x="260" y="454" text-anchor="middle">UAE</text>
    <text x="480" y="454" text-anchor="middle">Saudi Arabia</text>
    <text x="700" y="454" text-anchor="middle">Germany</text>
  </g>
  <text x="480" y="492" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6f6a60">Figure 1. AI specialists by country (2025), based on figures cited in the source article.</text>
</svg>
