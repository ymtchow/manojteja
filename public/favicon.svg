<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">YMT premium ring favicon</title>
  <desc id="desc">Premium navy and gold YMT ring emblem for The Cross-Border Risk Review</desc>
  <defs>
    <radialGradient id="navy" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#16243a"/>
      <stop offset="58%" stop-color="#0b1424"/>
      <stop offset="100%" stop-color="#050912"/>
    </radialGradient>
    <linearGradient id="gold" x1="13%" y1="10%" x2="87%" y2="90%">
      <stop offset="0%" stop-color="#fff2bf"/>
      <stop offset="22%" stop-color="#d79a2e"/>
      <stop offset="47%" stop-color="#fff0b4"/>
      <stop offset="72%" stop-color="#b77518"/>
      <stop offset="100%" stop-color="#f6d276"/>
    </linearGradient>
    <linearGradient id="deepGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f5c18"/>
      <stop offset="45%" stop-color="#ffe6a0"/>
      <stop offset="100%" stop-color="#a96b19"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="#f7f1e7"/>
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="205" fill="url(#navy)"/>
    <circle cx="256" cy="256" r="214" fill="none" stroke="url(#gold)" stroke-width="16"/>
    <circle cx="256" cy="256" r="189" fill="none" stroke="#1b2b44" stroke-width="10"/>
    <circle cx="256" cy="256" r="183" fill="none" stroke="url(#deepGold)" stroke-width="5" opacity="0.96"/>
    <path d="M145 188a128 128 0 0 1 222 0" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
    <path d="M367 324a128 128 0 0 1-222 0" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g filter="url(#textShadow)">
    <text x="256" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="155" font-weight="700" letter-spacing="-15" fill="#06101f" stroke="#0b1526" stroke-width="11">YMT</text>
    <text x="256" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="155" font-weight="700" letter-spacing="-15" fill="url(#gold)" stroke="#fff0b4" stroke-width="2.5">YMT</text>
    <text x="256" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="155" font-weight="700" letter-spacing="-15" fill="none" stroke="#7a4b13" stroke-width="1.4" opacity="0.55">YMT</text>
  </g>
</svg>
